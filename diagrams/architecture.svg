<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f9d55"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b6fd8"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d64545"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="48" font-size="26" font-weight="700" fill="#1b2340">Teleport Access Lab: Architecture</text>
  <text x="40" y="76" font-size="15" fill="#5a6278">Every connection goes through one front door. Servers dial out to it, so nothing needs to be open on them.</text>

  <!-- Windows PC -->
  <rect x="40" y="120" width="340" height="250" rx="14" fill="#f3f5fb" stroke="#1b2340" stroke-width="2"/>
  <text x="60" y="152" font-size="18" font-weight="700" fill="#1b2340">Windows host PC</text>
  <text x="60" y="176" font-size="13" fill="#5a6278">VirtualBox host, 192.168.56.1</text>
  <rect x="60" y="192" width="300" height="56" rx="8" fill="#ffffff" stroke="#c7cde0"/>
  <text x="74" y="214" font-size="14" font-weight="600" fill="#1b2340">Browser</text>
  <text x="74" y="235" font-size="12.5" fill="#5a6278">keenan-admin and dev-user, each with MFA</text>
  <rect x="60" y="256" width="300" height="44" rx="8" fill="#ffffff" stroke="#c7cde0"/>
  <text x="74" y="283" font-size="14" font-weight="600" fill="#1b2340">PowerShell <tspan font-weight="400" font-size="12.5" fill="#5a6278">setup only</tspan></text>
  <rect x="60" y="308" width="300" height="48" rx="8" fill="#ffffff" stroke="#c7cde0"/>
  <text x="74" y="329" font-size="14" font-weight="600" fill="#1b2340">mkcert private CA</text>
  <text x="74" y="347" font-size="12.5" fill="#5a6278">signs the web certificate, trusted by all VMs</text>

  <!-- host-only network frame -->
  <rect x="420" y="100" width="745" height="670" rx="18" fill="none" stroke="#9aa3bd" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="440" y="128" font-size="14" font-weight="600" fill="#5a6278">VirtualBox host-only network, 192.168.56.0/24</text>

  <!-- tp-proxy -->
  <rect x="610" y="150" width="380" height="200" rx="14" fill="#1b2340"/>
  <text x="632" y="184" font-size="19" font-weight="700" fill="#ffffff">tp-proxy</text>
  <text x="972" y="184" font-size="14" fill="#b9c2e0" text-anchor="end">192.168.56.10</text>
  <text x="632" y="208" font-size="13" fill="#b9c2e0">The front door, teleport.lab.internal:443</text>
  <rect x="632" y="222" width="336" height="112" rx="8" fill="#26305a"/>
  <text x="648" y="246" font-size="13.5" fill="#ffffff">Auth Service: users, roles, short-lived certificates</text>
  <text x="648" y="270" font-size="13.5" fill="#ffffff">Proxy Service: web UI and the only entry point</text>
  <text x="648" y="294" font-size="13.5" fill="#ffffff">Audit log and session recordings</text>
  <text x="648" y="318" font-size="13.5" fill="#ffffff">Roles: editor, access, auditor, developer</text>

  <!-- PC to proxy -->
  <path d="M 380 220 L 606 220" stroke="#1f9d55" stroke-width="3.5" fill="none" marker-end="url(#arrGreen)"/>
  <rect x="390" y="180" width="210" height="26" rx="6" fill="#e7f6ee"/>
  <text x="495" y="198" font-size="12.5" font-weight="600" fill="#1f7a45" text-anchor="middle">HTTPS 443, password + MFA</text>
  <rect x="404" y="228" width="182" height="24" rx="6" fill="#e7f6ee"/>
  <text x="495" y="245" font-size="12.5" fill="#1f7a45" text-anchor="middle">short-lived certificates</text>

  <!-- nodes -->
  <!-- tp-node1 -->
  <rect x="450" y="520" width="220" height="200" rx="14" fill="#f3f5fb" stroke="#1b2340" stroke-width="2"/>
  <text x="470" y="552" font-size="17" font-weight="700" fill="#1b2340">tp-node1</text>
  <text x="470" y="574" font-size="13" fill="#5a6278">192.168.56.11</text>
  <rect x="470" y="586" width="80" height="24" rx="12" fill="#dfe8ff"/>
  <text x="510" y="603" font-size="12.5" font-weight="600" fill="#2b4fa8" text-anchor="middle">env=dev</text>
  <text x="470" y="634" font-size="12.5" fill="#1b2340">Teleport SSH service</text>
  <text x="470" y="654" font-size="12.5" fill="#1b2340">Linux account dev, no sudo</text>
  <rect x="470" y="668" width="180" height="34" rx="6" fill="#fde8e8"/>
  <text x="560" y="690" font-size="12.5" font-weight="600" fill="#b83232" text-anchor="middle">Firewall: deny incoming</text>

  <!-- tp-node2 -->
  <rect x="695" y="520" width="220" height="200" rx="14" fill="#f3f5fb" stroke="#1b2340" stroke-width="2"/>
  <text x="715" y="552" font-size="17" font-weight="700" fill="#1b2340">tp-node2</text>
  <text x="715" y="574" font-size="13" fill="#5a6278">192.168.56.12</text>
  <rect x="715" y="586" width="86" height="24" rx="12" fill="#ffe9d6"/>
  <text x="758" y="603" font-size="12.5" font-weight="600" fill="#a8561b" text-anchor="middle">env=prod</text>
  <text x="715" y="634" font-size="12.5" fill="#1b2340">Teleport SSH service</text>
  <text x="715" y="654" font-size="12.5" fill="#1b2340">Hidden from developer role</text>
  <rect x="715" y="668" width="180" height="34" rx="6" fill="#fde8e8"/>
  <text x="805" y="690" font-size="12.5" font-weight="600" fill="#b83232" text-anchor="middle">Firewall: deny incoming</text>

  <!-- tp-db -->
  <rect x="940" y="520" width="205" height="200" rx="14" fill="#f3f5fb" stroke="#1b2340" stroke-width="2"/>
  <text x="960" y="552" font-size="17" font-weight="700" fill="#1b2340">tp-db</text>
  <text x="960" y="574" font-size="13" fill="#5a6278">192.168.56.13</text>
  <rect x="960" y="586" width="86" height="24" rx="12" fill="#e5f4e9"/>
  <text x="1003" y="603" font-size="12.5" font-weight="600" fill="#2e7d46" text-anchor="middle">env=data</text>
  <text x="960" y="634" font-size="12.5" fill="#1b2340">PostgreSQL 16, cert auth</text>
  <text x="960" y="654" font-size="12.5" fill="#1b2340">Teleport Database service</text>
  <rect x="960" y="668" width="168" height="34" rx="6" fill="#fde8e8"/>
  <text x="1044" y="690" font-size="12.5" font-weight="600" fill="#b83232" text-anchor="middle">Firewall: deny incoming</text>

  <!-- reverse tunnels, outbound from nodes up to proxy -->
  <path d="M 560 520 L 700 354" stroke="#3b6fd8" stroke-width="3" fill="none" stroke-dasharray="9 6" marker-end="url(#arrBlue)"/>
  <path d="M 805 520 L 800 354" stroke="#3b6fd8" stroke-width="3" fill="none" stroke-dasharray="9 6" marker-end="url(#arrBlue)"/>
  <path d="M 1042 520 L 900 354" stroke="#3b6fd8" stroke-width="3" fill="none" stroke-dasharray="9 6" marker-end="url(#arrBlue)"/>
  <rect x="600" y="732" width="420" height="28" rx="8" fill="#eaf0fd" stroke="#3b6fd8"/>
  <text x="810" y="751" font-size="13" fill="#2b4fa8" text-anchor="middle"><tspan font-weight="700">Reverse tunnels, outbound only:</tspan> each server calls the front door</text>

  <!-- blocked direct SSH -->
  <path d="M 190 370 C 190 520, 320 600, 446 610" stroke="#d64545" stroke-width="3" fill="none" stroke-dasharray="4 6" marker-end="url(#arrRed)"/>
  <circle cx="300" cy="560" r="17" fill="#ffffff" stroke="#d64545" stroke-width="3"/>
  <path d="M 290 550 L 310 570 M 310 550 L 290 570" stroke="#d64545" stroke-width="3.5"/>
  <rect x="62" y="598" width="208" height="44" rx="8" fill="#fde8e8" stroke="#d64545"/>
  <text x="166" y="617" font-size="13" font-weight="700" fill="#b83232" text-anchor="middle">Direct SSH on port 22</text>
  <text x="166" y="634" font-size="12" fill="#b83232" text-anchor="middle">blocked, connection times out</text>

  <!-- legend -->
  <g font-size="12.5" fill="#1b2340">
    <line x1="60" y1="700" x2="100" y2="700" stroke="#1f9d55" stroke-width="3.5"/>
    <text x="110" y="704">User traffic through Teleport</text>
    <line x1="60" y1="724" x2="100" y2="724" stroke="#3b6fd8" stroke-width="3" stroke-dasharray="9 6"/>
    <text x="110" y="728">Outbound reverse tunnel</text>
    <line x1="60" y1="748" x2="100" y2="748" stroke="#d64545" stroke-width="3" stroke-dasharray="4 6"/>
    <text x="110" y="752">Blocked path</text>
  </g>
</svg>
